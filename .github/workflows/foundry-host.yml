name: Foundry host regression

on:
  push:
    branches:
      - "work/staged-production-quality-20261111"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Fetch test-only JSON runtime
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            https://repo.maven.apache.org/maven2/org/json/json/20250107/json-20250107.jar \
            -o /tmp/foundry-json.jar
      - name: Test strict offline model-bundling contract without large fixture
        run: python3 -m unittest discover -s tests -p 'test_embedded_model_contract.py'
      - name: Run core, stage, part-surface and export regression suites
        env:
          FOUNDRY_JSON_JAR: /tmp/foundry-json.jar
        run: bash scripts/test-core.sh

  android-source-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # GitHub's Ubuntu runner already provides the Android SDK. Installing
      # the retired sdkmanager 'tools' package breaks setup-android@v3.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install target Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMGR"
          "$SDKMGR" --sdk_root="$ANDROID_HOME" --install "platforms;android-35" "build-tools;35.0.1"
      - name: Compile Android source with pinned offline dependencies
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:compileDebugJavaWithJavac --no-daemon --stacktrace
