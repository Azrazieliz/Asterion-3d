plugins { id 'com.android.application' }

def nativeStage = layout.buildDirectory.dir('offline-native')
def python = providers.gradleProperty('foundryPython').orElse(
        System.getProperty('os.name').startsWith('Windows') ? 'python' : 'python3')

tasks.register('prepareOfflineModel', Exec) {
    inputs.file(rootProject.file('scripts/prepare_native.py'))
    inputs.dir(rootProject.file('third-party'))
    outputs.dir(nativeStage)
    commandLine python.get(), rootProject.file('scripts/prepare_native.py'),
            '--stage', nativeStage.get().asFile
}

android {
    namespace 'com.asterion.foundry'
    compileSdk 35
    defaultConfig {
        applicationId 'com.asterion.foundry'
        minSdk 29
        targetSdk 35
        versionCode 3
        versionName '0.3.0-volume-research'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir(nativeStage.map { it.dir('assets') })
    sourceSets.main.jniLibs.srcDir(nativeStage.map { it.dir('jni') })
    androidResources { noCompress += 'tflite' }
    packaging.jniLibs.useLegacyPackaging = false
}
dependencies {
    implementation files(nativeStage.map { it.file('jars/litert-1.4.2.jar') },
            nativeStage.map { it.file('jars/litert-api-1.4.2.jar') },
            nativeStage.map { it.file('jars/onnxruntime-android-1.31.1.jar') })
}
tasks.named('preBuild').configure { dependsOn 'prepareOfflineModel' }
